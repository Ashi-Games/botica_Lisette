spring.application.name=lisette

# Puerto: Render define PORT; en tu compu usa 8080
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Base de datos (por defecto, tu MySQL local sin contraseña)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_botica_lisette?serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}