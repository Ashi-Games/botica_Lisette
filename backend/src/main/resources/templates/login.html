<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>

<body class="login-page">

<div class="login-card">

    <div class="login-brand">
        <div class="brand-icon">
            <i class="bi bi-plus-lg"></i>
        </div>
        Botica Lisette
    </div>

    <h2>Iniciar sesión</h2>

    <p class="login-description">
        Accede al sistema de gestión
    </p>

 <div class="alerta-error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
<div class="alerta-ok" th:if="${param.logout}">Sesión cerrada correctamente.</div>

<form th:action="@{/login}" method="post">

    <div class="login-field">
        <label>Usuario</label>
        <input type="text" name="username" class="form-control"
               placeholder="Ingresa tu usuario" required autofocus>
    </div>

    <div class="login-field">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-control"
               placeholder="Ingresa tu contraseña" required>
    </div>

    <button type="submit" class="btn-primary">Ingresar</button>

</form>

</div>

</body>
</html>
